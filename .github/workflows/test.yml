name: Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Gradle wrapper
        working-directory: frontend
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build frontend
        working-directory: frontend
        run: ./gradlew wasmJsBrowserDistribution --no-daemon --stacktrace

      - name: Verify frontend output
        run: |
          set -euo pipefail
          dist=frontend/build/dist/wasmJs/productionExecutable
          test -f "$dist/index.html"
          test -f "$dist/tweetgif.js"
          test -f "$dist/tweetgif.wasm"

  backend:
    name: Backend (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.22', '1.23' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Create frontend stub for go:embed
        run: |
          set -euo pipefail
          mkdir -p frontend/build/dist/wasmJs/productionExecutable
          printf '<!doctype html><title>build-stub</title>' \
            > frontend/build/dist/wasmJs/productionExecutable/index.html

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l . || true)"
          if [ -n "$unformatted" ]; then
            echo "Go code is not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build backend
        run: CGO_ENABLED=0 go build -o /tmp/tweet-gif-web-test .

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: bash syntax check
        run: |
          set -euo pipefail
          bash -n install.sh
          for f in *.sh; do
            [ "$f" = "install.sh" ] && continue
            bash -n "$f"
          done
          echo "shell syntax OK"

      - name: Verify systemd unit template renders
        run: |
          set -euo pipefail
          mkdir -p /tmp/unitcheck
          SERVICE_NAME=tweet-gif-web
          INSTALL_DIR=/opt/tweet-gif-web
          CONFIG_DIR=/etc/tweet-gif-web
          DATA_DIR=/var/lib/tweet-gif-web
          sed -n '/cat > "\/etc\/systemd\/system\/${SERVICE_NAME}.service" <<UNIT/,/^UNIT$/p' install.sh \
            | sed '1d;$d' > /tmp/unitcheck/tweet-gif-web.service
          grep -q '^\[Unit\]' /tmp/unitcheck/tweet-gif-web.service
          grep -q 'EnvironmentFile=' /tmp/unitcheck/tweet-gif-web.service
          echo "unit template OK"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Create frontend stub for go:embed
        run: |
          set -euo pipefail
          mkdir -p frontend/build/dist/wasmJs/productionExecutable
          printf '<!doctype html><title>build-stub</title>' \
            > frontend/build/dist/wasmJs/productionExecutable/index.html

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout=5m
